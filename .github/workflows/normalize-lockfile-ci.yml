name: Normalize WARLOCK Website Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/normalize-lockfile-ci.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  normalize:
    name: Normalize package-lock on repair branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Normalize lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit normalized lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already normalized"
            exit 0
          fi
          git config user.name "warlock-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Normalize website package lock"
          git push origin "HEAD:${{ github.head_ref }}"
