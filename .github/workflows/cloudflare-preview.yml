name: WARLOCK Cloudflare Preview

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: Cloudflare Pages preview project (must end with -preview)
        required: true
        default: warlock-audio-preview
      preview_label:
        description: Optional preview branch label
        required: false
        default: manual
  push:
    branches:
      - preview/cloudflare

permissions:
  contents: read

jobs:
  deploy-preview:
    name: Build and deploy preview only
    runs-on: ubuntu-latest
    environment: preview
    env:
      NITRO_PRESET: cloudflare_pages
      VITE_AUTH_ENABLED: "false"
      WARLOCK_FACTORY_PUBLIC_INTAKE_ENABLED: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.project_name || vars.CLOUDFLARE_PREVIEW_PROJECT || 'warlock-audio-preview' }}
      PREVIEW_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_label || 'branch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Enforce preview-only target
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROJECT_NAME" =~ -preview$ ]]; then
            echo "::error::Cloudflare project must end with -preview. Production projects are blocked."
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare preview credentials are not configured in GitHub secrets."
            exit 1
          fi

      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile stayed immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json

      - name: Typecheck
        run: npm run typecheck

      - name: Build Cloudflare Pages target
        run: npm run build:dev

      - name: Verify fail-closed Cloudflare output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_worker.js/index.js
          test -f dist/_routes.json
          if grep -R --binary-files=without-match -n "WARLOCK_FACTORY_INTAKE_TOKEN" dist/assets 2>/dev/null; then
            echo "::error::Factory secret identifier leaked into browser assets."
            exit 1
          fi

      - name: Smoke Cloudflare Pages runtime before deploy
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          npx --yes wrangler@4 pages dev dist --ip 127.0.0.1 --port 8791 >"$LOG" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat "$LOG"' EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8791/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Cloudflare Pages local runtime did not become ready."
            exit 1
          fi
          for route in / /generate /products /products/void /pricing /presets /skins /technology /support /status /login /account; do
            code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8791${route}")"
            if (( code < 200 || code >= 400 )); then
              echo "::error::Cloudflare runtime route ${route} returned HTTP ${code}."
              exit 1
            fi
          done

      - name: Ensure isolated preview project exists
        shell: bash
        run: |
          set -euo pipefail
          PROJECTS_JSON="$(npx --yes wrangler@4 pages project list --json)"
          if ! printf '%s' "$PROJECTS_JSON" | jq -e --arg name "$PROJECT_NAME" '.[] | select(.name == $name)' >/dev/null; then
            echo "Creating isolated preview-only Cloudflare Pages project: $PROJECT_NAME"
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch __preview_only__
          else
            echo "Using existing preview project: $PROJECT_NAME"
          fi

      - name: Deploy isolated Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          SAFE_LABEL="$(printf '%s' "$PREVIEW_LABEL" | tr -cd '[:alnum:]-' | tr '[:upper:]' '[:lower:]')"
          [[ -n "$SAFE_LABEL" ]] || SAFE_LABEL="branch"
          BRANCH="preview-${SAFE_LABEL}-${SHORT_SHA}"
          echo "Deploying commit $GITHUB_SHA to preview branch $BRANCH of $PROJECT_NAME"
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PROJECT_NAME" \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

      - name: Record deployment truth
        shell: bash
        run: |
          {
            echo "## WARLOCK Cloudflare Preview"
            echo ""
            echo "- Project: \`$PROJECT_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Factory public intake: DISARMED"
            echo "- Auth mode: preview/dev fallback"
            echo "- Production domain promotion: NOT PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"
