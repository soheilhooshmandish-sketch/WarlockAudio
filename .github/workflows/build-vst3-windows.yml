name: Build Warlock VST3 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "artifacts/WarlockJUCE/**"
      - ".github/workflows/build-vst3-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Release VST3 + installer
    runs-on: windows-2022
    defaults:
      run:
        working-directory: artifacts/WarlockJUCE

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (VS 2022 x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3
        run: cmake --build build --config Release --parallel

      - name: Normalize VST3 bundle name
        shell: pwsh
        run: |
          $vst3Root = "build\Warlock_artefacts\Release\VST3"
          $built = Join-Path $vst3Root "Warlock Chainsaw Distortion.vst3"
          $dest  = Join-Path $vst3Root "Warlock.vst3"
          Write-Host "VST3 folder contents:"
          if (Test-Path $vst3Root) {
            Get-ChildItem $vst3Root | Format-Table Name, Mode, Length
          } else {
            throw "VST3 output folder missing: $vst3Root"
          }
          if (-not (Test-Path $dest)) {
            if (-not (Test-Path $built)) {
              throw "Expected bundle not found: $built"
            }
            Copy-Item -Recurse $built $dest
          }
          Get-ChildItem -Recurse $dest | Select-Object FullName, Length

      - name: Install Inno Setup
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Upload VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: Warlock.vst3
          path: artifacts/WarlockJUCE/build/Warlock_artefacts/Release/VST3/Warlock.vst3
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Warlock_Distortion_Setup_x64
          path: artifacts/WarlockJUCE/BuildInstaller/Warlock_Distortion_Setup_x64.exe
          if-no-files-found: error
