name: WARLOCK Website CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

jobs:
  web-quality:
    name: Typecheck + tests + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile stayed immutable
        shell: bash
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json changed during npm ci"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test platform contracts with isolated PWA identity
        shell: bash
        run: |
          set -euo pipefail
          REPO="$PWD"
          mapfile -d '' OTHER_TESTS < <(find "$REPO/scripts" -type f -name '*.test.mjs' ! -name 'grok-pwa-plugin.test.mjs' -print0)
          node --test "${OTHER_TESTS[@]}"

          PWA_CWD="$(mktemp -d)"
          (
            cd "$PWA_CWD"
            node --test "$REPO/scripts/grok-pwa-plugin.test.mjs"
          )

          node --experimental-strip-types --test \
            "$REPO/src/lib/app-data/app-data.test.ts" \
            "$REPO/src/lib/auth/gate-identity.test.ts"
      - name: Build website
        run: npm run build:dev
