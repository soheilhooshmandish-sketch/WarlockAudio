name: WARLOCK Website CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

jobs:
  web-quality:
    name: Typecheck + tests + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Report lockfile drift
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json remained unchanged"
          else
            echo "::warning::package-lock.json is stale on main and was normalized in CI; repair it in a dedicated lockfile PR."
            git diff --stat -- package-lock.json
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build website
        run: npm run build:dev
