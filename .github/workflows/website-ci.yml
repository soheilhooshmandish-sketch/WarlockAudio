name: WARLOCK Website CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/website-ci.yml"
      - ".github/workflows/cloudflare-preview.yml"
  workflow_dispatch:

jobs:
  web-quality:
    name: Typecheck + tests + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile stayed immutable
        shell: bash
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::package-lock.json changed during npm ci"
            exit 1
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test platform, Factory, refiner, asset, account, health and sandbox-commerce contracts
        shell: bash
        run: |
          set -euo pipefail
          REPO="$PWD"
          mapfile -d '' OTHER_TESTS < <(find "$REPO/scripts" -type f -name '*.test.mjs' ! -name 'grok-pwa-plugin.test.mjs' -print0)
          node --test "${OTHER_TESTS[@]}"

          PWA_CWD="$(mktemp -d)"
          (
            cd "$PWA_CWD"
            node --test "$REPO/scripts/grok-pwa-plugin.test.mjs"
          )

          node --experimental-strip-types --test \
            "$REPO/src/lib/app-data/app-data.test.ts" \
            "$REPO/src/lib/auth/gate-identity.test.ts" \
            "$REPO/src/lib/factory/intake-policy.test.ts" \
            "$REPO/src/lib/refiner/contract.test.ts" \
            "$REPO/src/lib/assets/catalog.test.ts" \
            "$REPO/src/lib/account/model.test.ts" \
            "$REPO/src/lib/health/public-health.test.ts" \
            "$REPO/src/lib/commerce/sandbox.test.ts"
      - name: Build default website target
        run: npm run build:dev
      - name: Build Cloudflare Pages preview target
        env:
          NITRO_PRESET: cloudflare_pages
          VITE_AUTH_ENABLED: "false"
          WARLOCK_FACTORY_PUBLIC_INTAKE_ENABLED: "false"
        run: npm run build:dev
      - name: Verify Cloudflare Pages server output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/_worker.js/index.js
          test -f dist/_routes.json
          echo "Cloudflare Pages Nitro output verified."
      - name: Smoke Cloudflare Pages runtime
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          npx --yes wrangler@4 pages dev dist --ip 127.0.0.1 --port 8791 >"$LOG" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" 2>/dev/null || true; cat "$LOG"' EXIT

          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8791/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Cloudflare Pages local runtime did not become ready."
            exit 1
          fi

          routes=(
            "/"
            "/generate"
            "/products"
            "/products/void"
            "/pricing"
            "/presets"
            "/skins"
            "/technology"
            "/support"
            "/status"
            "/login"
            "/account"
          )
          for route in "${routes[@]}"; do
            code="$(curl -sS --max-time 5 -o /dev/null -w '%{http_code}' "http://127.0.0.1:8791${route}")"
            if (( code < 200 || code >= 400 )); then
              echo "::error::Cloudflare runtime route ${route} returned HTTP ${code}."
              exit 1
            fi
            echo "${route} -> ${code}"
          done
