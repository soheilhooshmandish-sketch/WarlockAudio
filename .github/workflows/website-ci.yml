name: WARLOCK Website CI

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-ci.yml"
  push:
    branches:
      - "website/**"
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

jobs:
  website-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint redesigned website surfaces
        run: npx eslint src/routes/__root.tsx src/routes/index.tsx src/routes/generate.tsx src/routes/pricing.tsx src/routes/products.tsx src/routes/presets.tsx src/routes/skins.tsx src/routes/support.tsx

      - name: Production-style build
        run: npm run build:dev
